---
site_name: "LAB-31207 - Campaign Manager and AI Agent with MCP"
site_description: "Four-hour Webex Contact Center lab for native Campaign Manager, Webex AI Agent, MCP tools, and Real-Time Assist"
site_author: Luis Garcia Delgado, Juan Corral, Sebastian Hernandez, Stephanie Ross
site_url: https://cx-partner.github.io/LAB-31207/
copyright: Copyright &copy; 2026 Cisco
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.follow
    - toc.integrate
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: template_assets/webexLogo91.png
  favicon: template_assets/webex75.png
extra:
  generator: false
  repo: "https://github.com/cx-partner/LAB-31207"
  site_event: lab31207
extra_css:
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css
extra_javascript:
  - template_assets/js/newLoad.js
  - template_assets/js/setInfo.js
  - javascripts/extra.js
  - javascripts/site-utils.js
plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      skip_classes:
        - custom-skip-class-name
      auto_caption: true
      caption_position: top
markdown_extensions:
  - md_in_html
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - tables
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.keys
  - toc:
      permalink: true
      toc_depth: 3
nav:
  - Home: index.md
  - Overview: overview.md
  - Lab Access: lab-access.md
  - Customer Portal: customer-portal.md
  - Labs:
      - Lab 1 - Native Campaign Manager: lab1_campaign_manager.md
      - Lab 2 - AI Agent with MCP: lab2_debt_ai_agent.md
      - Lab 3 - Real-Time Assist: lab3_human_ai_assist.md
